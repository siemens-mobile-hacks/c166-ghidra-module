name: Build & Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  GHIDRA_VERSION: "12.1.3"
  GHIDRA_PATCHED_ARCHIVE: "ghidra_12.1.3_DEV_20260823.zip"
  GHIDRA_PATCHED_URL: "https://github.com/siemens-mobile-hacks/ghidra-patched/releases/download/12.1.3-2/ghidra_12.1.3_DEV_20260823.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download patched Ghidra
        run: |
          mkdir -p build
          cd build
          wget -q "${GHIDRA_PATCHED_URL}"
          unzip -q "${GHIDRA_PATCHED_ARCHIVE}"
          rm "${GHIDRA_PATCHED_ARCHIVE}"

      - name: Set Ghidra environment variable
        run: echo "GHIDRA_INSTALL_DIR=$GITHUB_WORKSPACE/build/ghidra_${GHIDRA_VERSION}_DEV" >> $GITHUB_ENV

      - name: Build and test
        run: |
          chmod +x gradlew tools/test-tasking-abi.sh tools/test-patched-decompiler.sh
          ./tools/test-tasking-abi.sh
          ./tools/test-patched-decompiler.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-zip
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
